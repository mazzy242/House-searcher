name: Refresh data and deploy

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      skip_espc:
        description: "Skip ESPC (refresh map layers + journey times only)"
        type: boolean
        default: false
  push:
    paths-ignore: ["**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

# Code pushes and data refreshes queue separately: GitHub keeps only one *pending* run per group,
# so sharing a group let a push silently cancel a waiting refresh.
concurrency:
  group: ${{ github.event_name == 'push' && 'push' || 'refresh' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest -q pipeline/tests
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build

  refresh:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      build_failed: ${{ steps.build.outcome == 'failure' }}
    steps:
      # The branch tip, not the commit that triggered the run: a queued refresh must build on the
      # data the previous refresh saved, or the two collide when this one commits.
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Cache GTFS download
        uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: gtfs-${{ github.run_id }}
          restore-keys: gtfs-
      - name: Build data
        id: build
        continue-on-error: true
        run: python pipeline/build.py ${{ inputs.skip_espc && '--skip-espc' || '' }}
      - name: Upload debug HTML (for fixing the ESPC parser)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espc-debug
          path: pipeline/debug/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data state
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          # public/data and state are regenerated in full each run, so if a code push or another
          # refresh touched them meanwhile, this run's copy (the newest) wins.
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: [test, refresh]
    # Deploy after a refresh, or after a push to the default branch.
    if: >-
      always() && needs.test.result == 'success' &&
      (needs.refresh.result == 'success' ||
       (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" } # picks up the data commit made by the refresh job
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.build_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Part of the data refresh failed - see the 'Build data' step log and public/data/meta.json. The site was still deployed with the last good data."
          exit 1
