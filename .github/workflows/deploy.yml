name: Deploy site

# Builds the site from the branch tip (code + the latest committed data) and publishes it to Pages.
# Started by each data refresh once its data is committed, and called by code pushes.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" } # the branch tip, with the newest data commit
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  # A separate job, as in GitHub's own Pages workflow: deploy-pages looks the artifact up by name,
  # and straight after the upload GitHub sometimes doesn't list it yet ("No artifacts named
  # github-pages"). If that still happens, wait a minute and try once more.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency: { group: "pages-${{ github.ref }}", cancel-in-progress: false }
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
